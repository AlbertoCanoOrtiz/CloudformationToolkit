AWSTemplateFormatVersion: "2010-09-09"
Description: API Gateway HTTP API for Gmail MCP Server (SSE/FastMCP)

Parameters:

  LambdaArn:
    Type: String
    Default: !ImportValue dogsjgp-gmail-mcp-lambda-arn

Resources:

  GmailMcpHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: dogsjgp-gmail-mcp-api
      ProtocolType: HTTP
      Description: HTTP API Gateway for Gmail MCP Server

  GmailMcpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref GmailMcpHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
      PayloadFormatVersion: "2.0"

  GmailMcpRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref GmailMcpHttpApi
      RouteKey: "ANY /gmailMCP"
      Target: !Sub integrations/${GmailMcpIntegration}

  GmailMcpStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref GmailMcpHttpApi
      StageName: prod
      AutoDeploy: true

  GmailMcpLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GmailMcpHttpApi}/*/*/gmailMCP

Outputs:

  McpEndpoint:
    Description: MCP API endpoint URL
    Value: !Sub https://${GmailMcpHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod/gmailMCP
